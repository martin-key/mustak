# Автоматични проверки: lint, типове, unit и интеграционни тестове, production build.
# Пускат се за всеки pull request към main и не публикуват нищо.
# Workflow-ът за Docker образа (docker-publish.yml) вика същите проверки преди build на образа.
name: Тестове

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  # Нов commit в PR спира старата проверка. В main не се спира нищо: там чака публикуването.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, типове, тестове, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Същата major версия като в Dockerfile (node:24-alpine).
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Типове
        run: npm run typecheck

      - name: Unit тестове
        run: npm run test:unit

      # Testcontainers вдига истински PostgreSQL 18 в Docker на runner-а.
      - name: Интеграционни тестове
        run: npm run test:integration

      # Без база и без .env, както в Docker build: хваща четене от базата при build (Cache Components).
      - name: Production build
        run: npm run build && npm run build:scripts
        env:
          NEXT_TELEMETRY_DISABLED: 1
