# Целият стек: приложение + PostgreSQL.
#   cp .env.example .env   # попълнете паролите и ключа
#   docker compose up --build
#
# Базата е само във вътрешна Docker мрежа: няма публикуван порт и няма достъп до интернет.
name: mustak

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mustak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:-mustak}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  app:
    build: .
    image: mustak-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mustak}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-mustak}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Собственик}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Cloudflare Turnstile (по желание). Приложението е в мрежа с достъп до интернет, за да стига до Cloudflare.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    # Минимални права: файловата система е само за четене, без root привилегии.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
